<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Admin Registration | PabeKothay</title>
        <link rel="stylesheet" href="../Design/style1.css">
        <script src="../Script/Admin_reg.js" defer></script>
    </head>
    <body id="reg">
        <header class="hdr">
            <img src="pabekothay logo 1.jpeg" id="logo" alt="PabeKothay logo">
            <h2>PabeKothay </h2>
            <p class="tag">Find what you need, share what you have</p>
            <p class="port">Admin Portal</p>
        </header>

        <div class="reg-main">
            <div class="reg-intro">
                <h1>Administrator Registration</h1>
                <p>Create your administrator account. Admin approval is required before you can sign in.</p>
            </div>

            <div class="reg-card">
                <h2 id="regTitle">Admin Access Request</h2>
                <form id="regForm" method="post">
                    <div class="reg-fields">
                        <div class="reg-field lft">
                            <label for="name">Full name</label>
                            <input id="name" name="fullName" type="text" autocomplete="name" required>
                        </div>

                        <div class="reg-field rgt">
                            <label for="email">Official work email</label>
                            <input id="email" name="email" type="email" autocomplete="email" required>
                        </div>

                        <div class="reg-field lft">
                            <label for="phone">Phone number</label>
                            <input id="phone" name="phone" type="tel" autocomplete="tel" required>
                        </div>

                        <div class="reg-field rgt">
                            <label for="dob">Date of birth</label>
                            <input id="dob" name="dateOfBirth" type="date" min="1900-01-01" max="2026-12-31" required>
                        </div>

                        <fieldset class="reg-field lft gender">
                            <legend>Gender</legend>
                            <label><input type="radio" name="gender" value="male" required> Male</label>
                            <label><input type="radio" name="gender" value="female" required> Female</label>
                            <label><input type="radio" name="gender" value="other" required> Other</label>
                        </fieldset>

                        <div class="reg-field rgt">
                            <label for="dept">Admin department</label>
                            <select id="dept" name="department" required>
                                <option value="" selected disabled>Select department</option>
                                <option value="student-accounts">Student Accounts</option>
                                <option value="marketplace">Marketplace</option>
                                <option value="support">Customer Support</option>
                            </select>
                        </div>

                        <div class="reg-field lft">
                            <label for="pass">Create password</label>
                            <input id="pass" name="password" type="password" autocomplete="new-password" required>
                        </div>

                        <div class="reg-field rgt">
                            <label for="confirmPass">Confirm password</label>
                            <input id="confirmPass" name="confirmPassword" type="password" autocomplete="new-password" required>
                        </div>
                    </div>

                    <div class="act">
                        <button type="submit">Create Account</button>
                        <p>Already have an account? <a href="AdminLogin.html">Log in</a></p>
                    </div>
                </form>
            </div>
        </div>

        <footer class="small-footer">© 2026 PabeKothay. All rights reserved.</footer>
    </body>
</html>
